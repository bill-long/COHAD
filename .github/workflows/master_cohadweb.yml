# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - cohadweb

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build Web
      run: dotnet build Web/Web.csproj --configuration Release

    - name: Test with dotnet
      run: dotnet test Web.UnitTests/Web.UnitTests.csproj --configuration Release

    - name: dotnet publish
      run: dotnet publish Web/Web.csproj --configuration Release --output ./publish

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'cohadweb'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_4cc98d8b282841d0a4715655839f3079 }}
        package: ./publish