# Pull-request gate. The deploy workflow (main_cohadweb.yml) runs the same
# checks, but only on push to main - by which point a regression is already
# merged and is blocking a production deploy rather than a review. This runs
# them where they can still stop the change.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Web/ClientApp/package-lock.json

      - name: Install dependencies
        working-directory: Web/ClientApp
        run: npm ci

      # Includes the template accessibility rules, which run at error severity.
      - name: Lint
        working-directory: Web/ClientApp
        run: npx ng lint

      - name: Test
        working-directory: Web/ClientApp
        run: npx ng test --no-watch --browsers=ChromeHeadlessCI

      - name: Build
        working-directory: Web/ClientApp
        run: npx ng build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Web/Web.csproj --configuration Release

      - name: Test
        run: dotnet test Web.UnitTests/Web.UnitTests.csproj --configuration Release
