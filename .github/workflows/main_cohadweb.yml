# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - cohadweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cohadweb
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check if still latest commit
        id: latest-check
        run: |
          git fetch origin main
          if [ "${{ github.sha }}" != "$(git rev-parse origin/main)" ]; then
            echo "Skipping — newer commit exists on main"
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          fi

      # The frontend is built by `dotnet publish` but was never linted or tested
      # here, so template accessibility rules and the Angular specs only ever ran
      # on a developer's machine. Run them before anything else, so a failure
      # surfaces in seconds rather than after a full publish.
      - name: Set up Node
        if: steps.latest-check.outputs.is_latest == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Web/ClientApp/package-lock.json

      - name: Install frontend dependencies
        if: steps.latest-check.outputs.is_latest == 'true'
        working-directory: Web/ClientApp
        run: npm ci

      - name: Lint frontend
        if: steps.latest-check.outputs.is_latest == 'true'
        working-directory: Web/ClientApp
        run: npx ng lint

      - name: Test frontend
        if: steps.latest-check.outputs.is_latest == 'true'
        working-directory: Web/ClientApp
        run: npx ng test --no-watch --browsers=ChromeHeadlessCI

      - name: Set up .NET 10
        if: steps.latest-check.outputs.is_latest == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Web
        if: steps.latest-check.outputs.is_latest == 'true'
        run: dotnet build Web/Web.csproj --configuration Release

      - name: Test with dotnet
        if: steps.latest-check.outputs.is_latest == 'true'
        run: dotnet test Web.UnitTests/Web.UnitTests.csproj --configuration Release

      - name: dotnet publish
        if: steps.latest-check.outputs.is_latest == 'true'
        run: dotnet publish Web/Web.csproj --configuration Release --output ./publish

      - name: Re-check if still latest commit
        if: steps.latest-check.outputs.is_latest == 'true'
        id: pre-deploy-check
        run: |
          git fetch origin main
          if [ "${{ github.sha }}" != "$(git rev-parse origin/main)" ]; then
            echo "Skipping deploy — newer commit landed during build"
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Azure Web App
        if: steps.pre-deploy-check.outputs.is_latest == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'cohadweb'
          slot-name: 'production'
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_4cc98d8b282841d0a4715655839f3079 }}
          package: ./publish