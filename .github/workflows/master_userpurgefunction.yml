name: Build and deploy Azure Function - user purge

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-userpurgefunction
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check if still latest commit
        id: latest-check
        run: |
          git fetch origin master
          if [ "${{ github.sha }}" != "$(git rev-parse origin/master)" ]; then
            echo "Skipping — newer commit exists on master"
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET 10
        if: steps.latest-check.outputs.is_latest == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build UserPurgeFunction
        if: steps.latest-check.outputs.is_latest == 'true'
        run: dotnet build Functions/UserPurgeFunction/UserPurgeFunction.csproj --configuration Release

      - name: dotnet publish UserPurgeFunction
        if: steps.latest-check.outputs.is_latest == 'true'
        run: dotnet publish Functions/UserPurgeFunction/UserPurgeFunction.csproj --configuration Release --output ./publish -p:SkipWebpackBuild=true

      - name: Re-check if still latest commit
        if: steps.latest-check.outputs.is_latest == 'true'
        id: pre-deploy-check
        run: |
          git fetch origin master
          if [ "${{ github.sha }}" != "$(git rev-parse origin/master)" ]; then
            echo "Skipping deploy — newer commit landed during build"
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Azure Function App
        if: steps.pre-deploy-check.outputs.is_latest == 'true'
        uses: Azure/functions-action@v1.5.4
        with:
          app-name: ${{ secrets.AzureFunctionApp_Name_UserPurge }}
          package: ./publish
          publish-profile: ${{ secrets.AzureFunctionApp_PublishProfile_UserPurge }}

