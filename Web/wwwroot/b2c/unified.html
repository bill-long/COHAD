<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Sign in – COHAD</title>
    <style>
        /*
         * Azure AD B2C custom page template.
         *
         * B2C injects its own fully-styled UI into <div id="api">.
         * We only override layout ordering so social IdP buttons
         * (Google, etc.) appear above the local-account form.
         */

        /* Prevent browser dark-mode from inverting B2C's light UI */
        :root { color-scheme: light; }

        /* Use flexbox on the container to reorder children */
        #api {
            display: flex !important;
            flex-direction: column;
        }

        /* Social providers first, then divider, then local account */
        #api > .social       { order: 1; }
        #api > .divider      { order: 2; }
        #api > .localAccount { order: 3; }
    </style>
</head>
<body>
    <div id="api">
        <!-- Azure AD B2C injects its UI here -->
    </div>
</body>
</html>
