<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Sign in – COHAD</title>
    <style>
        /*
         * Azure AD B2C custom page template.
         *
         * B2C injects its UI into <div id="api">. The injected markup for the
         * "unified" sign-up-or-sign-in page looks roughly like:
         *
         *   #api
         *     div.localAccount   (email / password form)
         *     div.divider        ("OR")
         *     div.social         (social IdP buttons)
         *
         * We use flexbox ordering to move .social above .localAccount so
         * Google (and any future social providers) appear first — especially
         * important on mobile where the local-account form pushes social
         * buttons below the fold.
         */

        html, body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background-color: #f5f5f5;
        }

        /* Centre the B2C-injected content */
        #api {
            display: flex;
            flex-direction: column;
            max-width: 440px;
            margin: 2rem auto;
            padding: 2rem;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        /* Social providers first, then divider, then local account */
        #api > .social   { order: 1; }
        #api > .divider  { order: 2; }
        #api > .localAccount { order: 3; }

        /* Give social buttons some breathing room */
        #api > .social {
            margin-bottom: 0.5rem;
        }

        /* Style the "OR" divider */
        #api > .divider {
            text-align: center;
            margin: 1rem 0;
            color: #666;
        }

        @media (max-width: 480px) {
            #api {
                margin: 1rem;
                padding: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div id="api">
        <!-- Azure AD B2C injects its UI here -->
    </div>
</body>
</html>
