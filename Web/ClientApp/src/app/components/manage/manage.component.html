<div class="manage-container">
    <nav mat-tab-nav-bar [tabPanel]="managePanel" aria-label="Manage navigation">
        <a mat-tab-link *ngIf="manageUsersVisible$ | async"
           routerLink="users" routerLinkActive #rla1="routerLinkActive"
           [active]="rla1.isActive">Users</a>
        <a mat-tab-link *ngIf="manageHomesVisible$ | async"
           routerLink="homes" routerLinkActive #rla2="routerLinkActive"
           [active]="rla2.isActive">Homes</a>
        <a mat-tab-link *ngIf="manageEmailVisible$ | async"
           routerLink="send-email" routerLinkActive #rla3="routerLinkActive"
           [active]="rla3.isActive">Email</a>
        <a mat-tab-link *ngIf="printDirectoryVisible$ | async"
           routerLink="print" routerLinkActive #rla4="routerLinkActive"
           [active]="rla4.isActive">Print Directory</a>
        <a mat-tab-link *ngIf="manageDocumentsVisible$ | async"
           routerLink="documents" routerLinkActive #rla5="routerLinkActive"
           [active]="rla5.isActive">Documents</a>
        <a mat-tab-link *ngIf="manageEventsVisible$ | async"
           routerLink="events" routerLinkActive #rla6="routerLinkActive"
           [active]="rla6.isActive">Events</a>
        <a mat-tab-link *ngIf="manageBlogVisible$ | async"
           routerLink="blog" routerLinkActive #rla7="routerLinkActive"
           [active]="rla7.isActive">News</a>
        <a mat-tab-link *ngIf="manageAuditVisible$ | async"
           routerLink="audit-log" routerLinkActive #rla8="routerLinkActive"
           [active]="rla8.isActive">Audit Log</a>
    </nav>
    <mat-tab-nav-panel #managePanel>
        <div class="manage-content">
            <router-outlet></router-outlet>
        </div>
    </mat-tab-nav-panel>
</div>
