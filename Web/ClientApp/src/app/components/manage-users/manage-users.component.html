<table mat-table [dataSource]="dataSource" matSort [ngClass]="{ 'displaynone': focusedUser != null }">

    <ng-container matColumnDef="givenName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Given Name </th>
        <td mat-cell *matCellDef="let user"> {{user.givenName}} </td>
    </ng-container>

    <ng-container matColumnDef="surname">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Surname </th>
        <td mat-cell *matCellDef="let user"> {{user.surname}} </td>
    </ng-container>

    <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
        <td mat-cell *matCellDef="let user"> {{user.email}} </td>
    </ng-container>

    <ng-container matColumnDef="identityProvider">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Identity Provider </th>
        <td mat-cell *matCellDef="let user"> {{user.identityProvider}} </td>
    </ng-container>

    <ng-container matColumnDef="lastLoggedIn">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Last Login </th>
      <td mat-cell *matCellDef="let user"> {{user.lastLoggedIn | date:'medium'}} </td>
  </ng-container>

    <ng-container matColumnDef="streetAddress">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Street Address </th>
        <td mat-cell *matCellDef="let user"> {{user.streetAddress}} </td>
    </ng-container>

    <ng-container matColumnDef="roles">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Roles </th>
        <td mat-cell *matCellDef="let user">
            <div *ngFor="let role of user.roles">{{role}}</div>
        </td>
    </ng-container>

    <ng-container matColumnDef="ownedHomes">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Homes </th>
        <td mat-cell *matCellDef="let user">
            <div *ngFor="let home of user.ownedHomes">{{home.streetNumber}} {{home.streetName}}</div>
        </td>
    </ng-container>

    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let user">
            <button mat-icon-button color="primary" aria-label="Edit" (click)="focusedUser = user">
                <mat-icon>edit</mat-icon>
            </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
    <tr mat-row *matRowDef="let row; columns: columnsToDisplay"></tr>
</table>

<app-user *ngIf="focusedUser != null" [apiUser]="focusedUser" [allHomes]="(allHomes$ | async)!"
    (doneEvent)="focusedUser = null"></app-user>
