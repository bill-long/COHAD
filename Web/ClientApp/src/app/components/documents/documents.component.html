<div class="container documents-page">
  <section class="documents-shell">
    <div class="documents-header">
      <h1>Resident Documents</h1>
      <p>Download HOA documents shared with residents.</p>
    </div>

    <div class="cohad-inline-alert cohad-inline-alert--error" *ngIf="error" role="alert">{{ error }}</div>

    <div class="loading-state" *ngIf="loading">Loading documents...</div>

    <section class="documents-list" *ngIf="!loading && documents.length > 0">
      <div class="document-card" *ngFor="let doc of documents">
        <button class="file-link" type="button" (click)="downloadFile(doc)">
          <mat-icon class="file-icon">{{ getFileIcon(doc) }}</mat-icon>
          <span class="file-name">{{ doc.displayName }}</span>
          <span class="file-chip">{{ getFileTypeChip(doc) }}</span>
        </button>

        <div class="document-meta">
          <span>{{ doc.createdUtc | date:'mediumDate' }}</span>
          <span class="meta-separator">-</span>
          <span>{{ formatSize(doc.sizeBytes) }}</span>
        </div>
      </div>
    </section>

    <div *ngIf="!loading && documents.length === 0" class="empty-state">
      No documents available yet.
    </div>
  </section>
</div>
