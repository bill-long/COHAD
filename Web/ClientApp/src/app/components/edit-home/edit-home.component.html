<mat-card class="homeCard">
  <mat-card-header>
    <mat-card-title>{{ homeCopy.streetNumber }} {{ homeCopy.streetName }}</mat-card-title>
    <mat-card-subtitle>Home contact information</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content class="sections">
    <!-- Home contact info (hidden, edit via dialog) -->
    <section class="section compactRow">
      <div class="compactRowLeft">
        <div class="sectionTitle">Home contact info</div>
        <div class="compactSummary">
          <span class="compactLabel">Email</span>
          <span class="compactValue">{{ homeEmailSummary }}</span>
          <span class="compactSep">•</span>
          <span class="compactLabel">Phone</span>
          <span class="compactValue">{{ homePhoneSummary }}</span>
        </div>
      </div>
      <div class="sectionActions">
        <button mat-stroked-button color="primary" (click)="openHomeContactDialog()" [disabled]="saveInProgress" aria-label="Edit home contact info">
          Edit home contact info
        </button>
      </div>
    </section>

    <!-- Residents -->
    <section class="section">
      <div class="sectionHeader">
        <div>
          <div class="sectionTitle">Residents</div>
          <div class="muted reorderHint">Drag to reorder (the phone number of the first resident appears on the map, unless a home phone number is set).</div>
        </div>
        <div class="sectionActions">
          <button mat-stroked-button color="primary" (click)="addResident()" aria-label="Add resident">Add resident</button>
          <button mat-flat-button color="primary" (click)="saveResidentOrder()" [disabled]="saveInProgress || !residentOrderDirty" aria-label="Save resident order">Save order</button>
          <button mat-stroked-button (click)="resetResidentOrder()" [disabled]="saveInProgress || !residentOrderDirty" aria-label="Reset resident order">Reset</button>
        </div>
      </div>

      <div class="sectionBody">
        <div *ngIf="homeCopy.residents?.length; else noResidents">
          <div
            class="residents-container"
            cdkDropList
            [cdkDropListData]="homeCopy.residents"
            (cdkDropListDropped)="dropResident($event)"
          >
            <div class="residentDragRow" *ngFor="let resident of homeCopy.residents" cdkDrag>
              <button mat-icon-button class="dragHandle" cdkDragHandle aria-label="Drag to reorder">
                <mat-icon>drag_indicator</mat-icon>
              </button>
              <div class="residentContent">
                <app-edit-resident
                  [resident]="resident"
                  [editEnabled]="isResidentEditing(resident)"
                  [saveInProgress]="saveInProgress"
                  (edit)="startResidentEdit(resident)"
                  (save)="saveResident(resident)"
                  (cancel)="cancelResidentEdit(resident)"
                  (delete)="confirmDeleteResident(resident)"
                ></app-edit-resident>
              </div>
            </div>
          </div>
        </div>
        <ng-template #noResidents><span class="muted">No residents listed.</span></ng-template>
      </div>
    </section>
  </mat-card-content>
</mat-card>
