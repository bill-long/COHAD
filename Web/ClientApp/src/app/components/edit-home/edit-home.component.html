<h2>{{homeCopy.streetNumber}} {{homeCopy.streetName}}</h2>

<div class="contact-info" *ngIf="homeCopy.emailAddress">
    <button mat-icon-button color="warn" aria-label="delete email" title="Delete email address" (click)="deleteEmail()"
        *ngIf="editEnabled">
        <mat-icon>delete</mat-icon>
    </button>
    <mat-form-field appearance="fill" class="emailInput">
        <mat-label>Email</mat-label>
        <input matInput [(ngModel)]="homeCopy.emailAddress.address" [disabled]="!editEnabled">
    </mat-form-field>
    <div class="contact-options">
        <mat-checkbox [(ngModel)]="homeCopy.emailAddress.visibleInDirectory" [disabled]="!editEnabled">Show in directory
        </mat-checkbox>
        <mat-checkbox [(ngModel)]="homeCopy.emailAddress.groupEmailOptedIn" [disabled]="!editEnabled">Receive
            neighborhood
            emails at this address
        </mat-checkbox>
    </div>
</div>

<div class="contact-info" *ngIf="homeCopy.phoneNumber">
    <button mat-icon-button color="warn" aria-label="delete phone number" title="Delete phone number"
        (click)="deletePhone()" *ngIf="editEnabled">
        <mat-icon>delete</mat-icon>
    </button>
    <mat-form-field appearance="fill" class="phoneType">
        <mat-label>Type</mat-label>
        <mat-select [(ngModel)]="homeCopy.phoneNumber.type" [disabled]="!editEnabled">
            <mat-option value="Mobile">Mobile</mat-option>
            <mat-option value="Home">Home</mat-option>
            <mat-option value="Work">Work</mat-option>
        </mat-select>
    </mat-form-field>
    <app-phone-number-input [phoneNumber]="homeCopy.phoneNumber" [editEnabled]="editEnabled"></app-phone-number-input>
    <div class="contact-options">
        <mat-checkbox [(ngModel)]="homeCopy.phoneNumber.visibleInDirectory" [disabled]="!editEnabled">Show in directory
        </mat-checkbox>
    </div>
</div>

<div class="action-bar">
    <button mat-flat-button color="primary" (click)="addPhone()" *ngIf="editEnabled && homeCopy.phoneNumber == null">Add
        Home Phone</button>
    <button mat-flat-button color="primary" (click)="addEmail()"
        *ngIf="editEnabled && homeCopy.emailAddress == null">Add
        Home Email</button>
    <button mat-flat-button color="primary" (click)="addResident()" *ngIf="editEnabled">Add Resident</button>
</div>

<div class="residents-container">
    <app-edit-resident *ngFor="let resident of homeCopy.residents" [resident]="resident"
        (deleteResident)="deleteResident($event, resident)" [editEnabled]="editEnabled"></app-edit-resident>
</div>

<div class="action-bar" *ngIf="editEnabled">
    <button mat-flat-button color="primary" (click)="save()" [disabled]="saveInProgress">Save Changes</button>
    <button mat-flat-button color="warn" (click)="cancel()" [disabled]="saveInProgress">Cancel</button>
</div>
