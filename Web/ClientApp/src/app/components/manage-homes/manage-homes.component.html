<mat-form-field appearance="fill" [ngClass]="{ 'displaynone': focusedHome != null }">
    <mat-label>Search</mat-label>
    <input matInput [formControl]="homeFilter">
</mat-form-field>

<table mat-table [dataSource]="dataSource" matSort [ngClass]="{ 'displaynone': focusedHome != null }">

    <ng-container matColumnDef="streetNumber">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Street Number </th>
        <td mat-cell *matCellDef="let home"> {{home.streetNumber}} </td>
    </ng-container>

    <ng-container matColumnDef="streetName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Street Name </th>
        <td mat-cell *matCellDef="let home"> {{home.streetName}} </td>
    </ng-container>

    <ng-container matColumnDef="phoneNumber">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Phone Number </th>
        <td mat-cell *matCellDef="let home"> <span *ngIf="home.phoneNumber">({{home.phoneNumber.areaCode}})
                {{home.phoneNumber.prefix}}-{{('0000' + home.phoneNumber.lineNumber).slice(-4)}}</span></td>
    </ng-container>

    <ng-container matColumnDef="emailAddress">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Email Address </th>
        <td mat-cell *matCellDef="let home"> {{home.emailAddress}} </td>
    </ng-container>

    <ng-container matColumnDef="residents">
        <th mat-header-cell *matHeaderCellDef> Residents </th>
        <td mat-cell *matCellDef="let home">
            <div *ngFor="let resident of home.residents">{{resident.givenName}} {{resident.surname}}</div>
        </td>
    </ng-container>

    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let home">
            <button mat-icon-button color="primary" aria-label="Edit" (click)="focusedHome = home">
                <mat-icon>edit</mat-icon>
            </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
    <tr mat-row *matRowDef="let row; columns: columnsToDisplay"></tr>
</table>

<app-edit-home *ngIf="focusedHome != null" [home]="focusedHome" (doneEvent)="focusedHome = null"></app-edit-home>
