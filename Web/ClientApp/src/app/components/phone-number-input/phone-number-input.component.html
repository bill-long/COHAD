<mat-form-field appearance="fill">
    <mat-label>{{ label }}</mat-label>
    <!-- Deliberately no autocomplete="tel": this component is reused by
         app-edit-home, which an administrator also uses to edit *other*
         households in Manage > Homes. An autofill token there would offer the
         admin's own number for a neighbour's record. WCAG 1.3.5 covers fields
         that collect the user's own information; these do not, exclusively. -->
    <input *ngIf="editEnabled" matInput mask='(000) 000-0000' [formControl]="phoneNumberControl"
        [disabled]="!editEnabled" [attr.aria-label]="ariaLabel || null">
    <input *ngIf="!editEnabled" matInput disabled value="{{ getPhoneString() }}">
</mat-form-field>
