<div class="button-bar">
  <button *ngIf="!editing" color="primary" mat-raised-button (click)="startEdit()">Edit</button>
  <button *ngIf="editing" color="warn" mat-raised-button (click)="cancelEdit()">Cancel</button>
  <button *ngIf="editing" color="primary" mat-raised-button (click)="saveChanges()">Save</button>
</div>
<div class="dropzone-collection">
  <div class="titled-dropzone">
    <h3>Front Cover</h3>
    <div *ngIf="!editing" class="dropzone inactive">
      <img *ngIf="pdCopy.frontCoverDataUrl != null" [src]="pdCopy.frontCoverDataUrl" class="dropzone-image" />
    </div>
    <div *ngIf="editing" class="dropzone" (dragover)="dragOver($event)" (drop)="frontCoverDrop($event)">
      <div *ngIf="pdCopy.frontCoverDataUrl == ''">
        <div class="icon">
          <mat-icon>cloud_upload</mat-icon>
        </div>
        <div>
          <span>Drop file here</span>
        </div>
      </div>
      <img *ngIf="pdCopy.frontCoverDataUrl != ''" [src]="pdCopy.frontCoverDataUrl" class="dropzone-image" />
    </div>
  </div>
  <div class="titled-dropzone">
    <h3>Back Cover</h3>
    <div *ngIf="!editing" class="dropzone inactive">
      <img *ngIf="pdCopy.backCoverDataUrl != ''" [src]="pdCopy.backCoverDataUrl" class="dropzone-image" />
    </div>
    <div *ngIf="editing" class="dropzone" (dragover)="dragOver($event)" (drop)="backCoverDrop($event)">
      <div *ngIf="pdCopy.backCoverDataUrl == ''">
        <div class="icon">
          <mat-icon>cloud_upload</mat-icon>
        </div>
        <div>
          <span>Drop file here</span>
        </div>
      </div>
      <img *ngIf="pdCopy.backCoverDataUrl != ''" [src]="pdCopy.backCoverDataUrl" class="dropzone-image" />
    </div>
  </div>
</div>
<div>
  <mat-checkbox [(ngModel)]="pdCopy.addExtraPageBreak" [disabled]="!editing">Add Extra Page Break</mat-checkbox>
</div>
<div>
  <a mat-raised-button *ngIf="(id | async) !== 'new'" class="show-printable-directory-button" color="primary" routerLink="/printable-directory/{{id | async}}">Generate Printable Directory</a>
</div>
