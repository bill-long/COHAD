<div class="button-bar">
  <button color="warn" mat-raised-button (click)="cancelEdit()">Cancel</button>
  <button color="primary" mat-raised-button (click)="saveChanges()">Save</button>
</div>
<div class="dropzone-collection">
  <div class="titled-dropzone">
    <h3>Front Cover</h3>
    <div class="dropzone" (dragover)="dragOver($event)" (drop)="frontCoverDrop($event)">
      <div *ngIf="pdCopy.frontCoverDataUrl == ''">
        <div class="icon">
          <mat-icon>cloud_upload</mat-icon>
        </div>
        <div>
          <span>Drop file here</span>
        </div>
      </div>
      <img *ngIf="pdCopy.frontCoverDataUrl != ''" [src]="pdCopy.frontCoverDataUrl" class="dropzone-image" />
    </div>
  </div>
  <div class="titled-dropzone">
    <h3>Back Cover</h3>
    <div class="dropzone" (dragover)="dragOver($event)" (drop)="backCoverDrop($event)">
      <div *ngIf="pdCopy.backCoverDataUrl == ''">
        <div class="icon">
          <mat-icon>cloud_upload</mat-icon>
        </div>
        <div>
          <span>Drop file here</span>
        </div>
      </div>
      <img *ngIf="pdCopy.backCoverDataUrl != ''" [src]="pdCopy.backCoverDataUrl" class="dropzone-image" />
    </div>
  </div>
</div>
