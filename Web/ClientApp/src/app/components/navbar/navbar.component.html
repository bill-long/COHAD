<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <a class="navbar-brand" routerLink="">COHAD</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
    aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"
    (click)="isNavbarCollapsed = !isNavbarCollapsed">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div [ngbCollapse]="isNavbarCollapsed" class="collapse navbar-collapse" id="navbarSupportedContent">
    <ul class="navbar-nav ml-auto">
      <li class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <a class="nav-link text-sm-center" routerLink="">Home</a>
      </li>
      <li class="nav-item" routerLinkActive="active">
        <a class="nav-link text-sm-center" routerLink="about">About</a>
      </li>
      <li class="nav-item" routerLinkActive="active">
        <a class="nav-link text-sm-center" routerLink="news">News</a>
      </li>
      <li class="nav-item" routerLinkActive="active" *ngIf="(role$ | async) >= 1">
        <a class="nav-link text-sm-center" routerLink="documents">Documents</a>
      </li>
      <li class="nav-item" routerLinkActive="active" *ngIf="userName$ | async">
        <a class="nav-link text-sm-center" routerLink="dues">Dues</a>
      </li>
      <div ngbDropdown class="d-inline-block ml-2" *ngIf="userName$ | async as userName; else notSignedIn">
        <button class="btn btn-primary user-dropdown w-100" id="dropdownBasic1" ngbDropdownToggle>{{userName}}</button>
        <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
          <a class="dropdown-item" routerLink="profile">Profile</a>
          <button class="dropdown-item" (click)="logout()" [disabled]="disabled">Sign Out</button>
        </div>
      </div>
      <ng-template #notSignedIn>
        <button class="btn btn-success ml-2" (click)="login()" [disabled]="disabled">Sign In</button>
      </ng-template>
    </ul>
  </div>
</nav>
