<mat-toolbar color="primary">
  <span class="badge"> COHAD </span>
  <div>
    <a mat-flat-button color="primary" routerLink="" routerLinkActive="mat-accent"
      [routerLinkActiveOptions]="{exact: true}">Home</a>
    <a mat-flat-button color="primary" routerLink="about" routerLinkActive="mat-accent">About</a>
    <button mat-flat-button color="primary" *ngIf="userName$ | async as userName"
      [matMenuTriggerFor]="userMenu">{{userName}}</button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item (click)="logout()" [disabled]="disabled">Sign Out</button>
    </mat-menu>
    <button mat-button *ngIf="!(userName$ | async)" (click)="login()" [disabled]="disabled">Sign In</button>
  </div>
</mat-toolbar>
