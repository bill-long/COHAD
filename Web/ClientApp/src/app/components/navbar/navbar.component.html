<mat-toolbar *ngIf="isHidden !== true">
  <ng-container *ngIf="navVm$ | async as vm">
  <div class="nav-desktop">
    <span class="toolbar-app-title"> COHAD </span>
    <div class="nav-left">
      <a mat-button routerLink="" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a mat-button routerLink="news" routerLinkActive="active-link">News</a>
      <a *ngIf="showEventsNav$ | async" mat-button routerLink="events" routerLinkActive="active-link">Events</a>
      <a mat-button routerLink="about" routerLinkActive="active-link">About</a>
      <a *ngIf="vm.showGuestPrivacy" mat-button routerLink="privacy" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Privacy
        Policy</a>
      <a mat-button *ngIf="vm.showAuthenticatedNav" routerLink="residents" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: false }">Residents</a>
      <a mat-button *ngIf="manageVisible$ | async" routerLink="manage" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: false }">Manage</a>
      <button
        mat-icon-button
        class="notification-bell-button"
        *ngIf="adminNotificationsVisible$ | async"
        [matMenuTriggerFor]="notificationMenu"
        [matBadge]="(unreadVendorFlagNotificationCount$ | async) || null"
        matBadgeColor="warn"
        aria-label="Notifications">
        <mat-icon>notifications</mat-icon>
      </button>
      <mat-menu #notificationMenu="matMenu" class="notification-menu">
        <ng-container *ngIf="vendorFlagNotifications$ | async as notifications">
          <ng-container *ngIf="notifications.length > 0; else noNotificationsDesktop">
            <button mat-menu-item *ngFor="let notification of notifications" (click)="openFlagNotification(notification)">
              <div class="notification-row">
                <div class="notification-title">{{ notification.authorDisplayName }} flagged vendor {{ notification.vendorName }}</div>
                <div class="notification-note">{{ notification.flagNote }}</div>
              </div>
            </button>
          </ng-container>
        </ng-container>
        <ng-template #noNotificationsDesktop>
          <span class="menu-empty-state">No new notifications</span>
        </ng-template>
      </mat-menu>
      <button mat-button *ngIf="vm.authUser?.identityClaims?.emails as emails" [matMenuTriggerFor]="userMenu">{{emails[0]}}</button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="toggleTheme()">{{ (isDarkTheme$ | async) ? 'Use light mode' : 'Use dark mode' }}</button>
        <button mat-menu-item (click)="logout()" [disabled]="disabled">Sign Out</button>
      </mat-menu>
      <ng-container *ngIf="!vm.authUser?.identityClaims?.emails">
        <button mat-button *ngIf="!useMockAuth" (click)="login()" [disabled]="disabled">Sign In</button>
        <button mat-button *ngIf="useMockAuth" [matMenuTriggerFor]="mockLoginMenu" [disabled]="disabled">Sign In As...</button>
        <mat-menu #mockLoginMenu="matMenu">
          <button mat-menu-item *ngFor="let u of mockUsers" (click)="loginAs(u.id)">{{u.label}}</button>
        </mat-menu>
      </ng-container>
    </div>
  </div>
  <div class="nav-mobile">
    <button mat-button [matMenuTriggerFor]="hamburgerMenu">
      <mat-icon>menu</mat-icon>
    </button>
    <mat-menu #hamburgerMenu="matMenu">
      <a mat-menu-item color="primary" routerLink="" routerLinkActive="mat-accent" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a mat-menu-item color="primary" routerLink="news" routerLinkActive="mat-accent">News</a>
      <a *ngIf="showEventsNav$ | async" mat-menu-item color="primary" routerLink="events" routerLinkActive="mat-accent">Events</a>
      <a mat-menu-item color="primary" routerLink="about" routerLinkActive="mat-accent">About</a>
      <a mat-menu-item color="primary" *ngIf="vm.showAuthenticatedNav" routerLink="residents"routerLinkActive="mat-accent" [routerLinkActiveOptions]="{ exact: false }">Residents</a>
      <a mat-menu-item color="primary" *ngIf="manageVisible$ | async" routerLink="manage" routerLinkActive="mat-accent" [routerLinkActiveOptions]="{ exact: false }">Manage</a>
      <button
        mat-menu-item
        color="primary"
        *ngIf="adminNotificationsVisible$ | async"
        [matMenuTriggerFor]="notificationMenuMobile"
        [matBadge]="(unreadVendorFlagNotificationCount$ | async) || null"
        matBadgeColor="warn">
        Notifications
      </button>
      <mat-menu #notificationMenuMobile="matMenu" class="notification-menu">
        <ng-container *ngIf="vendorFlagNotifications$ | async as notifications">
          <ng-container *ngIf="notifications.length > 0; else noNotificationsMobile">
            <button mat-menu-item *ngFor="let notification of notifications" (click)="openFlagNotification(notification)">
              <div class="notification-row">
                <div class="notification-title">{{ notification.authorDisplayName }} flagged vendor {{ notification.vendorName }}</div>
                <div class="notification-note">{{ notification.flagNote }}</div>
              </div>
            </button>
          </ng-container>
        </ng-container>
        <ng-template #noNotificationsMobile>
          <span class="menu-empty-state">No new notifications</span>
        </ng-template>
      </mat-menu>
      <ng-container *ngIf="!vm.authUser?.identityClaims?.emails">
        <button mat-menu-item *ngIf="!useMockAuth" (click)="login()" [disabled]="disabled">Sign In</button>
        <button mat-menu-item *ngIf="useMockAuth" [matMenuTriggerFor]="mockLoginMenuMobile" [disabled]="disabled">Sign In As...</button>
        <mat-menu #mockLoginMenuMobile="matMenu">
          <button mat-menu-item *ngFor="let u of mockUsers" (click)="loginAs(u.id)">{{u.label}}</button>
        </mat-menu>
      </ng-container>
      <button mat-menu-item color="primary" *ngIf="vm.authUser?.identityClaims?.emails as emails" [matMenuTriggerFor]="userMenu">{{emails[0]}}</button>
    </mat-menu>
  </div>
  </ng-container>
</mat-toolbar>
