<mat-toolbar *ngIf="isHidden !== true">
  <ng-container *ngIf="navVm$ | async as vm">
  <div class="nav-desktop">
    <span class="toolbar-app-title"> COHAD </span>
    <div class="nav-left">
      <a mat-button routerLink="" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a mat-button routerLink="news" routerLinkActive="active-link">News</a>
      <a *ngIf="showEventsNav$ | async" mat-button routerLink="events" routerLinkActive="active-link">Events</a>
      <a mat-button routerLink="about" routerLinkActive="active-link">About</a>
      <a mat-button routerLink="committees" routerLinkActive="active-link">Committees</a>
      <a *ngIf="vm.showGuestPrivacy" mat-button routerLink="privacy" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Privacy
        Policy</a>
      <a mat-button *ngIf="vm.showAuthenticatedNav" routerLink="residents" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: false }">Residents</a>
      <a mat-button *ngIf="manageVisible$ | async" routerLink="manage" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: false }">Manage</a>
      <button
        mat-icon-button
        class="help-button"
        *ngIf="helpVisible$ | async"
        (click)="openHelp()"
        matTooltip="Help"
        aria-label="Help">
        <mat-icon>help_outline</mat-icon>
      </button>
      <button
        mat-icon-button
        class="notification-bell-button"
        *ngIf="notificationBellVisible$ | async"
        [matMenuTriggerFor]="notificationMenu"
        [matBadge]="(unreadCount$ | async) || null"
        matBadgeColor="warn"
        aria-label="Notifications">
        <mat-icon>notifications</mat-icon>
      </button>
      <mat-menu #notificationMenu="matMenu" class="notification-menu">
        <ng-template matMenuContent>
          <ng-container *ngIf="(notifications$ | async) as notifications">
            <ng-container *ngIf="notifications.length > 0; else noNotifications">
              <!-- Keyboard containment: MatMenu closes itself on Tab (keyManager.tabOut), which would
                   make the inline mark-as-handled buttons unreachable, so Tab/Shift+Tab are stopped at
                   this wrapper; cdkTrapFocus then wraps focus at the list edges so it can never land
                   outside the still-open menu (where Escape would no longer reach the panel). -->
              <div
                cdkTrapFocus
                (keydown.tab)="$event.stopPropagation()"
                (keydown.shift.tab)="$event.stopPropagation()">
                <div class="notification-item" [attr.data-notification-id]="notification.id" *ngFor="let notification of notifications">
                  <button mat-menu-item (click)="openNotification(notification)">
                    <div class="notification-row">
                      <div class="notification-header">
                        <span class="notification-title">{{ notification.title }}</span>
                        <span class="notification-time">{{ notification.createdUtc | timeAgo }}</span>
                      </div>
                      <div class="notification-note">{{ notification.summary }}</div>
                    </div>
                  </button>
                  <button
                    mat-icon-button
                    class="notification-dismiss"
                    *ngIf="notification.type === 'Registration'"
                    matTooltip="Mark as handled"
                    [attr.aria-label]="'Mark as handled: ' + notification.title"
                    (click)="acknowledge(notification, $event.currentTarget); $event.stopPropagation()">
                    <mat-icon>check</mat-icon>
                  </button>
                </div>
              </div>
            </ng-container>
            <ng-template #noNotifications>
              <span class="menu-empty-state">No new notifications</span>
            </ng-template>
          </ng-container>
        </ng-template>
      </mat-menu>
      <button mat-button *ngIf="vm.authUser?.identityClaims?.emails as emails" [matMenuTriggerFor]="userMenu">{{emails[0]}}</button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="toggleTheme()">{{ (isDarkTheme$ | async) ? 'Use light mode' : 'Use dark mode' }}</button>
        <button mat-menu-item (click)="logout()" [disabled]="disabled">Sign Out</button>
      </mat-menu>
      <ng-container *ngIf="!vm.authUser?.identityClaims?.emails">
        <button mat-button *ngIf="!useMockAuth" (click)="login()" [disabled]="disabled">Sign In</button>
        <button mat-button *ngIf="useMockAuth" [matMenuTriggerFor]="mockLoginMenu" [disabled]="disabled">Sign In As...</button>
        <mat-menu #mockLoginMenu="matMenu">
          <button mat-menu-item *ngFor="let u of mockUsers" (click)="loginAs(u.id)">{{u.label}}</button>
        </mat-menu>
      </ng-container>
    </div>
  </div>
  <div class="nav-mobile">
    <button mat-button [matMenuTriggerFor]="hamburgerMenu" aria-label="Open navigation menu">
      <mat-icon>menu</mat-icon>
    </button>
    <mat-menu #hamburgerMenu="matMenu">
      <a mat-menu-item color="primary" routerLink="" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a mat-menu-item color="primary" routerLink="news" routerLinkActive="active-link">News</a>
      <a *ngIf="showEventsNav$ | async" mat-menu-item color="primary" routerLink="events" routerLinkActive="active-link">Events</a>
      <a mat-menu-item color="primary" routerLink="about" routerLinkActive="active-link">About</a>
      <a mat-menu-item color="primary" routerLink="committees" routerLinkActive="active-link">Committees</a>
      <a mat-menu-item color="primary" *ngIf="vm.showAuthenticatedNav" routerLink="residents" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: false }">Residents</a>
      <a mat-menu-item color="primary" *ngIf="manageVisible$ | async" routerLink="manage" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: false }">Manage</a>
      <button
        mat-menu-item
        color="primary"
        *ngIf="notificationBellVisible$ | async"
        [matMenuTriggerFor]="notificationMenuMobile"
        [matBadge]="(unreadCount$ | async) || null"
        matBadgeColor="warn">
        Notifications
      </button>
      <button mat-menu-item color="primary" *ngIf="helpVisible$ | async" (click)="openHelp()">Help</button>
      <ng-container *ngIf="!vm.authUser?.identityClaims?.emails">
        <button mat-menu-item *ngIf="!useMockAuth" (click)="login()" [disabled]="disabled">Sign In</button>
        <button mat-menu-item *ngIf="useMockAuth" [matMenuTriggerFor]="mockLoginMenuMobile" [disabled]="disabled">Sign In As...</button>
      </ng-container>
      <button mat-menu-item color="primary" *ngIf="vm.authUser?.identityClaims?.emails as emails" [matMenuTriggerFor]="userMenu">{{emails[0]}}</button>
    </mat-menu>

    <!-- Sub-menus opened from within #hamburgerMenu are declared as SIBLINGS of it, never nested inside
         its content. MatMenu's `lazyContent` (and item) content queries use `descendants: true`, so a
         <mat-menu> physically nested in another menu's content - especially one holding a
         <ng-template matMenuContent> - is captured as the OUTER menu's own content and crashes the outer
         menu on open with "Cannot read properties of null (reading 'insertBefore')". Referencing the
         sub-menus by template variable keeps the trigger wiring intact without the fatal nesting. -->
    <mat-menu #notificationMenuMobile="matMenu" class="notification-menu">
      <ng-template matMenuContent>
        <ng-container *ngIf="(notifications$ | async) as notifications">
          <ng-container *ngIf="notifications.length > 0; else noNotificationsMobile">
            <!-- Tab containment + focus trap — same rationale as the desktop menu. -->
            <div
              cdkTrapFocus
              (keydown.tab)="$event.stopPropagation()"
              (keydown.shift.tab)="$event.stopPropagation()">
              <div class="notification-item" [attr.data-notification-id]="notification.id" *ngFor="let notification of notifications">
                <button mat-menu-item (click)="openNotification(notification)">
                  <div class="notification-row">
                    <div class="notification-header">
                      <span class="notification-title">{{ notification.title }}</span>
                      <span class="notification-time">{{ notification.createdUtc | timeAgo }}</span>
                    </div>
                    <div class="notification-note">{{ notification.summary }}</div>
                  </div>
                </button>
                <button
                  mat-icon-button
                  class="notification-dismiss"
                  *ngIf="notification.type === 'Registration'"
                  matTooltip="Mark as handled"
                  [attr.aria-label]="'Mark as handled: ' + notification.title"
                  (click)="acknowledge(notification, $event.currentTarget); $event.stopPropagation()">
                  <mat-icon>check</mat-icon>
                </button>
              </div>
            </div>
          </ng-container>
          <ng-template #noNotificationsMobile>
            <span class="menu-empty-state">No new notifications</span>
          </ng-template>
        </ng-container>
      </ng-template>
    </mat-menu>
    <mat-menu #mockLoginMenuMobile="matMenu">
      <button mat-menu-item *ngFor="let u of mockUsers" (click)="loginAs(u.id)">{{u.label}}</button>
    </mat-menu>
  </div>
  </ng-container>
</mat-toolbar>
